<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IIFL Trading Login</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#08101f,#0f1730);font-family:Inter,system-ui,Arial,sans-serif;color:#eef3ff}
    .card{width:min(420px,calc(100% - 32px));background:#121a2e;border:1px solid #263450;border-radius:20px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.3)}
    h1{margin:0 0 8px;font-size:26px}.sub{color:#91a0bd;margin:0 0 22px}
    label{display:block;font-size:12px;color:#91a0bd;margin:12px 0 7px}
    input{width:100%;box-sizing:border-box;background:#0d1528;color:#eef3ff;border:1px solid #30405f;border-radius:11px;padding:13px;font-size:14px;outline:none}
    input:focus{border-color:#6ea8fe}
    button{width:100%;margin-top:18px;border:0;border-radius:11px;padding:13px 16px;background:#6ea8fe;color:#071225;font-weight:800;cursor:pointer}
    .err{margin-top:14px;padding:10px 12px;border-radius:10px;background:#3c1f25;color:#ffc5ca;font-size:13px}
  </style>
</head>
<body>
  <form class="card" method="post">
    <h1>IIFL Trading</h1>
    <p class="sub">Sign in to access the trading dashboard.</p>
    <label>Username</label>
    <input name="username" autocomplete="username" required>
    <label>Password</label>
    <input name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Login</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
